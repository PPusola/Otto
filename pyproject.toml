[project]
name = "jarvis-local"
version = "0.1.0"
description = "Local voice assistant powered by Ollama, FastAPI, Spotify, and WiZ lights."
requires-python = ">=3.9"
dependencies = [
  "aiofiles>=23.2.1",
  "cryptography>=42.0.0",
  "fastapi>=0.111.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "pyttsx3>=2.90",
  "pywizlight>=0.5.14",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "respx>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
